<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/eTMS.png" />
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>eTMS</title>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      // If this page was left open (or bookmarked/reloaded) across a deploy, the browser's
      // cached index.html can still point at an entry script hash that a newer deploy has
      // since removed — a plain reload just re-serves the same stale cached HTML forever.
      // Catch the failed <script type="module"> load (capture phase — resource errors don't
      // bubble) and force one cache-busted reload to fetch the current build.
      (function () {
        var GUARD_KEY = "etms-cache-bust-reload";
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (!target || target.tagName !== "SCRIPT" || target.type !== "module") return;
            if (sessionStorage.getItem(GUARD_KEY)) return;
            sessionStorage.setItem(GUARD_KEY, "1");
            var url = new URL(window.location.href);
            url.searchParams.set("_r", Date.now().toString());
            window.location.replace(url.toString());
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
